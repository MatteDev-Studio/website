<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sito in Costruzione</title>
    <style>
        :root {
            --bg-color: #f4f4f4;
            --text-color: #111111;
            --accent-color: #000000;
            --border-color: #cccccc;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --text-color: #e0e0e0;
                --accent-color: #ffffff;
                --border-color: #333333;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        main {
            max-width: 600px;
            width: 100%;
            border: 1px solid var(--border-color);
            padding: 40px;
            background-color: transparent;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 1rem;
            margin-bottom: 24px;
        }

        .status {
            display: inline-block;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 4px 8px;
            border: 1px solid var(--text-color);
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="email"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-color);
            font-family: inherit;
            font-size: 1rem;
            border-radius: 0;
        }

        input[type="email"]:focus {
            outline: 2px solid var(--accent-color);
            outline-offset: -2px;
        }

        button {
            padding: 10px 20px;
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 0;
        }

        button:hover {
            opacity: 0.9;
        }

        footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: var(--border-color);
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        @media (max-width: 480px) {
            .input-group {
                flex-direction: column;
            }
            main {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <main>
        <div class="status">Sviluppo in corso</div>
        
        <h1>Pagina in costruzione</h1>
        
        <p>Il sito di MatteDev Studio si sta facendo più bello. Pagina in fase di sviluppo.</p>

        <a href="/index.html" style="text-decoration:none;">
            <button>Torna alla Home</button>

        <footer>
            &copy; 2026 MatteDev Studio. Tutti i diritti riservati.
        </footer>
    </main>

</body>
</html>
